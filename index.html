<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P1EXP // Platform-1 Experimental</title>
    
    <link rel="icon" type="image/png" href="./p1logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;700&display=swap" rel="stylesheet">

    <script src="./database.js"></script>

    <style>
        /* --- CORE SYSTEM RESET --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Jura', sans-serif;
            background-color: #0c0c0c;
            color: #e0e0e0;
            height: 100vh; /* Fallback for older browsers */
            height: 100dvh; /* The mobile Chrome UI fix */
            display: grid;
            grid-template-rows: 60px 1fr auto; 
            overflow: hidden; 
        }

        /* --- HARDWARE CUSTOM SCROLLBARS --- */
        main::-webkit-scrollbar { width: 8px; }
        main::-webkit-scrollbar-track { background: #0c0c0c; }
        main::-webkit-scrollbar-thumb { background: #222; border: 1px solid #333; border-radius: 4px; }
        main::-webkit-scrollbar-thumb:hover { background: #00ffcc; }

        /* --- FRAME 1: TOP NAV BAR --- */
        header {
            background-color: #121212; border-bottom: 2px solid #252525;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; z-index: 10; width: 100%;
        }

        header .logo { 
            font-weight: 700; 
            font-size: 1.2rem; 
            color: #00ffcc; 
            letter-spacing: 2px; 
            text-decoration: none; 
        }

        /* --- Align Nav Links to the Right --- */
        nav {
            text-align: right;
        }

        nav button {
            background: none; border: none; font-family: inherit; color: #888;
            margin-left: 25px; font-size: 0.9rem; text-transform: uppercase;
            font-weight: 500; letter-spacing: 1.5px; cursor: pointer; transition: color 0.2s; padding: 5px 0;
        }
        nav button:hover, nav button.active { color: #00ffcc; border-bottom: 2px solid #00ffcc; }

        /* --- FRAME 2: SCROLLING CENTER ENGINE --- */
        main {
            overflow-y: auto; padding-bottom: 0px; width: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 950px) minmax(0, 1fr);
            opacity: 1;
            transition: opacity 0.3s ease-in-out;
        }
        main.fade-out {
            opacity: 0;
        }

        /* --- FULL BLEED BANNERS --- */
        .full-banner { 
            grid-column: 1 / -1; 
            width: 100%; 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            background-color: #111; 
        }
        .banner-70 { height: 70vh; border-bottom: 2px solid #222; }
        .banner-60 { height: 60vh; border-top: 1px solid #222; border-bottom: 2px solid #222; margin-top: 0; } 

        .banner-img { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; filter: grayscale(40%) contrast(110%) brightness(65%); z-index: 1; 
        }

        .banner-heading { 
            position: relative; z-index: 2; color: #fff; text-align: center; 
            text-shadow: 0 4px 12px rgba(0,0,0,0.9); padding: 0 20px; 
        }
        .banner-heading h1 { font-size: 2.5rem; letter-spacing: 5px; font-weight: 700; }
        .banner-heading h2 { font-size: 2rem; letter-spacing: 4px; font-weight: 700; }

        /* --- 950px NARROW TEXT BLOCKS BELOW BANNERS --- */
        .narrow-text-block { 
            grid-column: 2; 
            padding: 40px 20px; 
            text-align: center; 
        }
        .narrow-text-block p { color: #ccc; line-height: 1.7; font-size: 1rem; letter-spacing: 0.5px; }

        /* --- LANDING PAGE SOCIAL & MEDIA MATRIX --- */
        .social-matrix-wrapper {
            grid-column: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px 50px 20px;
        }
        
        .matrix-label {
            font-size: 0.7rem;
            color: #555;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
            margin-top: 25px;
            font-weight: 700;
        }
        
        .social-matrix {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .social-icon {
            width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #222; border-radius: 4px;
            background: #121212; color: #888;
            transition: all 0.3s ease; text-decoration: none;
        }
        
        .social-icon svg { width: 20px; height: 20px; fill: currentColor; }
        
        .social-icon:hover { 
            background: #00ffcc; 
            color: #121212; 
            border-color: #00ffcc; 
            box-shadow: 0 0 15px rgba(0,255,204,0.3); 
        }

        /* --- 950px COLLECTION LIST WRAPPER --- */
        .collection-grid { 
            grid-column: 2; 
            padding: 0 20px 60px 20px; 
            display: flex;
            flex-direction: column;
            gap: 25px; 
        }

        /* --- HORIZONTAL ROW CARDS WITH SQUARE IMAGES --- */
        .project-layout-card { 
            background-color: #121212; border: 1px solid #222; border-radius: 4px; 
            overflow: hidden; display: flex; flex-direction: row; width: 100%;
        }
        
        .card-thumbnail { 
            width: 200px; 
            height: 200px; 
            object-fit: cover; 
            border-right: 1px solid #222; 
            flex-shrink: 0; 
        }

        .card-details { padding: 22px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-details h3 { color: #fff; font-size: 1.3rem; margin-bottom: 8px; font-weight: 700; letter-spacing: 1px; }
        .card-details p { font-size: 0.95rem; color: #aaa; line-height: 1.6; margin-bottom: 15px; }
        
        .meta-tag { font-size: 0.8rem; color: #00ffcc; background: #1a2925; padding: 3px 10px; align-self: flex-start; margin-bottom: 12px; border-radius: 3px; font-weight: 500; letter-spacing: 0.5px; }
        .card-footer-text { font-size: 0.8rem; color: #555; margin-top: auto; font-style: italic; font-weight: 400; }

        /* --- ACTION ROUTING BUTTONS --- */
        .route-link {
            align-self: flex-start; background: #1a1a1a; color: #00ffcc; 
            border: 1px solid #00ffcc; padding: 7px 16px; font-size: 0.8rem; 
            font-family: inherit; font-weight: 700; cursor: pointer; border-radius: 3px; 
            transition: all 0.2s; margin-top: auto; letter-spacing: 1.5px; text-transform: uppercase;
        }
        .route-link:hover { background: #00ffcc; color: #121212; box-shadow: 0 0 10px rgba(0,255,204,0.3); }

        /* --- NEXT PAGE ROUTING BUTTON --- */
        .next-page-wrapper {
            grid-column: 2;
            display: flex;
            justify-content: flex-end;
            padding: 20px 20px 0 20px; 
            border-top: 1px solid #222;
        }
        
        .next-page-btn {
            background: #111;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 12px 24px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border-radius: 3px;
        }
        
        .next-page-btn:hover {
            background: #00ffcc;
            color: #121212;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        /* --- COPYRIGHT TEXT --- */
        .copyright-text {
            grid-column: 1 / -1; 
            text-align: center;
            color: #444; 
            font-size: 0.75rem;
            letter-spacing: 1px;
            padding: 40px 20px 20px 20px;
        }

        /* --- FRAME 3: FOOTER RUNTIME MEDIA DECK --- */
        footer { background-color: #000000; border-top: 2px solid #222; z-index: 10; display: flex; flex-direction: column; align-items: center; position: relative; width: 100%; }
        .toggle-btn-container { width: 100%; display: flex; justify-content: center; margin-top: -14px; z-index: 20; transition: opacity 0.4s ease; }
        .toggle-btn-container.hidden { opacity: 0; pointer-events: none; }
        
        .toggle-btn { background-color: #121212; color: #00ffcc; border: 2px solid #222; border-radius: 20px; padding: 4px 18px; font-family: inherit; font-size: 0.75rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.6); letter-spacing: 1px; }
        .toggle-btn:hover { background-color: #00ffcc; color: #121212; border-color: #00ffcc; }
        
        /* --- DYNAMIC PLAYER HEIGHT ENGINE --- */
        .player-wrapper { 
            position: relative; 
            width: 100%; 
            max-width: 700px; 
            overflow: hidden; 
            transition: height 0.3s ease-in-out, padding 0.3s ease-in-out; 
            padding: 10px 0; 
            height: 80px; 
        }
        iframe#master-deck-frame { position: relative; z-index: 1; width: 100%; height: 100%; border: 0; background: #000; border-radius: 4px; }

        /* --- STATUS SCREENS (IDLE & LOADING) --- */
        .status-overlay {
            position: absolute;
            top: 10px; left: 0; right: 0; bottom: 10px;
            background-color: #000;
            color: #00ffcc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            z-index: 5;
            transition: opacity 0.4s ease;
            border-radius: 4px;
        }
        .status-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(0, 255, 204, 0.3);
            border-top-color: #00ffcc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .idle-indicator {
            width: 12px; height: 12px;
            background-color: #00ffcc;
            margin-right: 12px;
            border-radius: 2px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* --- UPDATED BANDCAMP SIZING --- */
        .player-wrapper[data-platform="bandcamp"] { height: 140px; }
        .player-wrapper[data-platform="bandcamp"].expanded { height: 300px; }

        /* --- UPDATED YOUTUBE SIZING (16:9 Focus) --- */
        .player-wrapper[data-platform="youtube"] { height: 160px; }
        .player-wrapper[data-platform="youtube"].expanded { height: 400px; }

        /* --- UPDATED MIXCLOUD SIZING --- */
        .player-wrapper[data-platform="mixcloud"] { height: 80px; padding: 5px 0; }
        .player-wrapper[data-platform="mixcloud"].expanded { height: 140px; } 

        /* --- RESPONSIVE MOBILE WIREFRAME OVERRIDES --- */
        @media (max-width: 768px) {
            .banner-70, .banner-60 { height: 60vh; } 
            .banner-heading h1 { font-size: 1.8rem; }
            .banner-heading h2 { font-size: 1.5rem; }
            .narrow-text-block { padding: 30px 15px; }
            
            .project-layout-card { flex-direction: column; }
            .card-thumbnail { 
                width: 100%; 
                height: auto; 
                aspect-ratio: 1 / 1; 
                border-right: none; 
                border-bottom: 1px solid #222; 
            }
            .collection-grid { padding: 0 15px 40px 15px; }
            .route-link { width: 100%; text-align: center; }
            .next-page-wrapper { justify-content: center; } 
            
            .player-wrapper { max-width: 100%; padding: 5px 15px; }
            
            /* Synced mobile heights with new desktop maximums */
            .player-wrapper[data-platform="bandcamp"].expanded { height: 300px; }
            .player-wrapper[data-platform="youtube"].expanded { height: 250px; }
            .player-wrapper[data-platform="mixcloud"].expanded { height: 140px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="https://linktr.ee/p1exp" class="logo" id="site-logo"></a>
        <nav id="nav-filters"></nav>
    </header>

    <main id="main-scroll-panel"></main>

    <footer>
        <div class="toggle-btn-container hidden" id="toggle-container">
            <button class="toggle-btn" id="tracklist-toggle" onclick="toggleTracklist()"></button>
        </div>
        <div class="player-wrapper" id="player-wrapper" data-platform="generic">
            
            <div id="deck-idle" class="status-overlay">
                <span class="idle-indicator"></span> AWAITING ARCHIVE SELECTION...
            </div>

            <div id="deck-preloader" class="status-overlay hidden">
                <span class="spinner"></span> LOADING TELEMETRY...
            </div>
            
            <iframe id="master-deck-frame" src="about:blank" allow="autoplay; encrypted-media; fullscreen"></iframe>
        </div>
    </footer>

    <script>
        function bootstrapApplication() {
            if (typeof masterCollectionRegistry === 'undefined') return;
            const config = siteConfiguration;

            document.getElementById('site-logo').textContent = config.logoTitle || '';
            document.getElementById('tracklist-toggle').textContent = config.sectionLabels.deckMatrixShow || '';

            const navContainer = document.getElementById('nav-filters');
            navContainer.innerHTML = '';

            config.navigationMenu.forEach((menuItem, idx) => {
                const btn = document.createElement('button');
                btn.textContent = menuItem.label;
                if (idx === 0) btn.className = 'active'; 
                btn.onclick = function() { switchCategory(menuItem.id, this); };
                navContainer.appendChild(btn);
            });

            loadPageView(config.navigationMenu[0].id);
            
            document.getElementById('player-wrapper').classList.remove('expanded');
        }

        function loadPageView(pageKey) {
            const pageMap = pageLayoutEngine[pageKey];
            if (!pageMap) return;

            let layoutHtml = '';

            layoutHtml += `
                <div class="full-banner banner-70">
                    <img src="./img_bg/${pageMap.titleBanner.imageName || ''}" class="banner-img">
                    <div class="banner-heading">
                        <h1>${pageMap.titleBanner.title || ''}</h1>
                    </div>
                </div>
                <div class="narrow-text-block">
                    <p>${pageMap.titleBanner.text || ''}</p>
                </div>
            `;

            // --- INJECT SOCIAL & MEDIA ICONS ONLY ON THE FIRST PAGE ---
            if (pageKey === siteConfiguration.navigationMenu[0].id) {
                layoutHtml += `
                    <div class="social-matrix-wrapper">
                        
                        <div class="matrix-label">SOCIAL PROTOCOLS</div>
                        <div class="social-matrix">
                            <a href="YOUR_TIKTOK_LINK" target="_blank" class="social-icon" title="TikTok">
                                <svg viewBox="0 0 24 24"><path d="M12.53.02C13.84 0 15.14.01 16.44.03c.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 2.78-1.15 5.54-3.33 7.31-1.92 1.57-4.58 2.22-6.99 1.7-2.73-.59-5.1-2.61-5.9-5.26-.8-2.67-.18-5.7 1.71-7.7 1.9-1.61 4.56-2.22 6.95-1.62v4.06c-1.3-.4-2.73-.1-3.79.72-.94.73-1.44 1.92-1.37 3.12.06 1.2.66 2.33 1.63 3.02 1.25.88 2.99 1.04 4.41.4 1.23-.54 2.11-1.67 2.36-3.02.09-.49.12-1 .12-1.51V0h-2.36z"/></svg>
                            </a>
                            <a href="YOUR_INSTA_LINK" target="_blank" class="social-icon" title="Instagram">
                                <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                            </a>
                            <a href="YOUR_FACEBOOK_LINK" target="_blank" class="social-icon" title="Facebook">
                                <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
                            </a>
                        </div>

                        <div class="matrix-label">MEDIA ARCHIVES</div>
                        <div class="social-matrix">
                            <a href="YOUR_YOUTUBE_LINK" target="_blank" class="social-icon" title="YouTube">
                                <svg viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                            </a>
                            <a href="YOUR_BANDCAMP_LINK" target="_blank" class="social-icon" title="Bandcamp">
                                <svg viewBox="0 0 24 24"><path d="M0 18.75l7.437-13.5h16.563l-7.437 13.5z"/></svg>
                            </a>
                            <a href="YOUR_MIXCLOUD_LINK" target="_blank" class="social-icon" title="Mixcloud">
                                <svg viewBox="0 0 24 24"><path d="M19.143 8.354a5.05 5.05 0 0 0-4.66-3.308c-2.427 0-4.464 1.7-4.939 4.025a3.987 3.987 0 0 0-3.666-2.4 3.982 3.982 0 0 0-3.983 3.983 3.996 3.996 0 0 0 2.502 3.693 4.148 4.148 0 0 0 .524.168h2.08l-.133-.146a4.425 4.425 0 0 1-1.046-2.825c0-2.436 1.986-4.422 4.422-4.422 2.392 0 4.338 1.905 4.42 4.281l.006.18h.423a2.695 2.695 0 1 1 .054 5.388h-6.2v3.084h6.059a5.772 5.772 0 0 0 4.137-9.701zm-9.014 6.136h-2.48l3.184-6.425v2.859l1.62-1.637v5.203h-2.324z"/></svg>
                            </a>
                            <a href="YOUR_SOUNDCLOUD_LINK" target="_blank" class="social-icon" title="SoundCloud">
                                <svg viewBox="0 0 24 24"><path d="M11.17 11.28c.12-.2.25-.39.42-.56.88-.89 2.08-1.44 3.41-1.44 2.65 0 4.8 2.15 4.8 4.8s-2.15 4.8-4.8 4.8H1c-.55 0-1-.45-1-1 0-.31.14-.6.37-.79.35-.3.8-.49 1.28-.49h7.4l1.12-5.32z"/></svg>
                            </a>
                        </div>
                        
                    </div>
                `;
            }

            if (pageMap.sections && pageMap.sections.length > 0) {
                pageMap.sections.forEach(section => {
                    
                    layoutHtml += `
                        <div class="full-banner banner-60">
                            <img src="./img_bg/${section.imageName || ''}" class="banner-img">
                            <div class="banner-heading">
                                <h2>${section.title || ''}</h2>
                            </div>
                        </div>
                    `;

                    if (section.text) {
                        layoutHtml += `
                            <div class="narrow-text-block">
                                <p>${section.text}</p>
                            </div>
                        `;
                    }

                    layoutHtml += `<div class="collection-grid">`;
                    if (section.archiveKeys && section.archiveKeys.length > 0) {
                        section.archiveKeys.forEach(catNo => {
                            const item = masterCollectionRegistry[catNo];
                            if (!item) return;

                            layoutHtml += `
                                <div class="project-layout-card">
                                    <img src="./img_coll/${catNo}.jpg" class="card-thumbnail">
                                    <div class="card-details">
                                        <h3>${item.title || ''}</h3>
                                        <span class="meta-tag">P1-${catNo} // ${item.date || ''}</span>
                                        <p>${item.description || ''}</p>
                                        ${item.mediaUrl ? `<button class="route-link" onclick="routeToDeck('${item.mediaUrl}')">▶ PLAY ARCHIVE DECK</button>` : ''}
                                        ${item.footer ? `<div class="card-footer-text">${item.footer}</div>` : ''}
                                    </div>
                                </div>
                            `;
                        });
                    }
                    layoutHtml += `</div>`; 
                });
            }

            const navMenu = siteConfiguration.navigationMenu;
            const currentIndex = navMenu.findIndex(item => item.id === pageKey);
            
            if (currentIndex !== -1 && currentIndex < navMenu.length - 1) {
                const nextItem = navMenu[currentIndex + 1];
                layoutHtml += `
                    <div class="next-page-wrapper">
                        <button class="next-page-btn" onclick="triggerNavigation('${nextItem.id}')">
                            NEXT AREA: ${nextItem.label} &#10142;
                        </button>
                    </div>
                `;
            }

            // --- INJECT DYNAMIC COPYRIGHT ---
            const currentYear = new Date().getFullYear();
            layoutHtml += `
                <div class="copyright-text">
                    &copy; ${currentYear} Platform-1 Experimental - All rights reserved
                </div>
            `;

            const mainPanel = document.getElementById('main-scroll-panel');
            mainPanel.classList.add('fade-out');
            
            setTimeout(() => {
                mainPanel.innerHTML = layoutHtml;
                mainPanel.scrollTop = 0;
                mainPanel.classList.remove('fade-out');
            }, 300); 
        }

        function triggerNavigation(targetPageKey) {
            const navMenu = siteConfiguration.navigationMenu;
            const targetIndex = navMenu.findIndex(item => item.id === targetPageKey);
            
            if (targetIndex !== -1) {
                const navButtons = document.querySelectorAll('#nav-filters button');
                if (navButtons[targetIndex]) {
                    switchCategory(targetPageKey, navButtons[targetIndex]);
                }
            }
        }

        function routeToDeck(targetUrl) {
            const deckFrame = document.getElementById('master-deck-frame');
            const wrapper = document.getElementById('player-wrapper');
            const preloader = document.getElementById('deck-preloader');
            const idleScreen = document.getElementById('deck-idle');
            const toggleContainer = document.getElementById('toggle-container');
            
            if (idleScreen) {
                idleScreen.classList.add('hidden');
            }
            
            if (toggleContainer) {
                toggleContainer.classList.remove('hidden');
            }

            preloader.classList.remove('hidden');
            deckFrame.src = 'about:blank'; 

            if (targetUrl.includes('bandcamp.com')) {
                wrapper.setAttribute('data-platform', 'bandcamp');
            } else if (targetUrl.includes('youtube.com')) {
                wrapper.setAttribute('data-platform', 'youtube');
            } else if (targetUrl.includes('mixcloud.com')) {
                wrapper.setAttribute('data-platform', 'mixcloud');
            } else {
                wrapper.setAttribute('data-platform', 'generic');
            }

            wrapper.classList.add('expanded');
            document.getElementById('tracklist-toggle').innerHTML = siteConfiguration.sectionLabels.deckMatrixHide;
            deckFrame.src = targetUrl;

            deckFrame.onload = function() {
                if (deckFrame.src !== 'about:blank' && deckFrame.src !== window.location.href) {
                    preloader.classList.add('hidden');
                }
            };
        }

        function switchCategory(categoryKey, buttonElement) {
            document.querySelectorAll('#nav-filters button').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            loadPageView(categoryKey);
        }

        function toggleTracklist() {
            const wrapper = document.getElementById('player-wrapper');
            const button = document.getElementById('tracklist-toggle');
            const labels = siteConfiguration.sectionLabels;

            wrapper.classList.toggle('expanded');
            button.innerHTML = wrapper.classList.contains('expanded') ? labels.deckMatrixHide : labels.deckMatrixShow;
        }

        bootstrapApplication();
    </script>
</body>
</html>
