<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio & Projects Hub</title>
    <style>
        /* --- CORE SYSTEM RESET --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #121212;
            color: #e0e0e0;
            height: 100vh;
            display: grid;
            /* 3-Frame Layout: Header (60px), Center (flexible), Footer (grows with content) */
            grid-template-rows: 60px 1fr auto; 
            overflow: hidden; 
        }

        /* --- MODERN CUSTOM SCROLLBARS --- */
        main::-webkit-scrollbar {
            width: 8px;
        }
        main::-webkit-scrollbar-track {
            background: #121212; 
        }
        main::-webkit-scrollbar-thumb {
            background: #252525; 
            border: 1px solid #333;
            border-radius: 4px;
        }
        main::-webkit-scrollbar-thumb:hover {
            background: #00ffcc; 
        }

        /* --- FRAME 1: TOP NAVIGATION BAR --- */
        header {
            background-color: #1a1a1a;
            border-bottom: 2px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }

        header .logo {
            font-weight: bold;
            font-size: 1.2rem;
            color: #00ffcc;
            letter-spacing: 1px;
        }

        nav button {
            background: none;
            border: none;
            font-family: inherit;
            color: #aaa;
            margin-left: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.2s;
            padding: 5px 0;
        }

        nav button:hover, nav button.active {
            color: #00ffcc;
            border-bottom: 2px solid #00ffcc;
        }

        /* --- FRAME 2: SCROLLING CENTER CONTENT --- */
        main {
            overflow-y: auto; 
            padding: 0 0 40px 0; 
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            border-left: 1px solid #222;
            border-right: 1px solid #222;
        }

        /* --- CALLABLE MAIN HERO BANNER STYLES --- */
        .workspace-hero {
            width: 100%;
            background-color: #161616;
            border-bottom: 2px solid #333;
            margin-bottom: 30px;
        }

        .hero-banner-img {
            width: 100%;
            height: 300px;
            object-fit: cover; 
            border-bottom: 1px solid #333;
            filter: grayscale(30%) contrast(110%); 
        }

        .hero-text-container {
            padding: 25px 20px;
        }

        .hero-text-container h1 {
            color: #ffffff;
            font-size: 1.8rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .hero-text-container p {
            line-height: 1.6;
            color: #aaa;
            font-size: 0.95rem;
        }

        /* Layout element wrapper */
        .content-inner-wrap {
            padding: 0 20px;
        }

        .matrix-switcher-block {
            background-color: #1a1a1a;
            border-left: 3px solid #00ffcc;
            padding: 15px 20px;
            margin-bottom: 35px;
            border-radius: 4px;
        }

        /* Dynamic Category Header Title */
        #category-title {
            color: #00ffcc;
            font-size: 1.3rem;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px dashed #333;
            padding-bottom: 8px;
        }

        /* --- AUTOMATIC PROJECT CARD STYLES --- */
        .project-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            margin-bottom: 30px;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .project-image {
            width: 100%;
            height: 250px;
            object-fit: cover; 
            border-bottom: 1px solid #333;
        }

        .project-info {
            padding: 20px;
        }

        .project-info h2 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .project-info p {
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 15px;
        }

        /* Text Links */
        main a {
            color: #00ffcc;
            text-decoration: underline;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        main a:hover {
            color: #121212;
            background-color: #00ffcc;
            text-decoration: none;
        }

        /* --- FRAME 3: BOTTOM DECK (BANDCAMP & TOGGLE) --- */
        footer {
            background-color: #1a1a1a;
            border-top: 2px solid #333;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .toggle-btn-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: -14px; 
            z-index: 20;
        }

        .toggle-btn {
            background-color: #1a1a1a;
            color: #00ffcc;
            border: 2px solid #333;
            border-radius: 20px;
            padding: 4px 15px;
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
        }

        .toggle-btn:hover {
            background-color: #00ffcc;
            color: #1a1a1a;
            border-color: #00ffcc;
        }

        .player-wrapper {
            width: 100%;
            max-width: 700px;
            height: 120px;
            overflow: hidden;
            transition: height 0.3s ease-in-out;
            padding: 0px 0;
        }

        .player-wrapper.expanded {
            height: 300px; 
        }

        iframe {
            border: 0;
            width: 100%;
            height: 280px; 
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">DESKTOP // LAB</div>
        <nav id="nav-filters">
            <button class="active" onclick="switchCategory('software', this)">Software</button>
            <button onclick="switchCategory('hardware', this)">Hardware</button>
            <button onclick="switchCategory('audio', this)">Audio</button>
        </nav>
    </header>

    <main id="main-scroll-panel">
        
        <section class="workspace-hero">
            <img id="hero-image" src="" alt="Lab Workspace Header" class="hero-banner-img">
            <div class="hero-text-container">
                <h1 id="hero-title">LOADING ENGINE...</h1>
                <p id="hero-description"></p>
            </div>
        </section>

        <div class="content-inner-wrap">
            
            <div class="matrix-switcher-block">
                <p>
                  Audio Deck Routing: 
                  <a href="#" onclick="changeTrack('album=327864152')">Album 1</a> | 
                  <a href="#" onclick="changeTrack('album=1568662603')">Album 2</a>.
                </p>
            </div>

            <h2 id="category-title">Archive Items</h2>

            <div id="project-list-container">
                <p style="color: #666;">Initializing multi-stream index arrays...</p>
            </div>
        </div>
        
    </main>

    <footer>
        <div class="toggle-btn-container">
            <button class="toggle-btn" id="tracklist-toggle" onclick="toggleTracklist()">▲ SHOW TRACKLIST</button>
        </div>
        
        <div class="player-wrapper" id="player-wrapper">
            <iframe id="bandcamp-player" src="https://bandcamp.com/EmbeddedPlayer/album=327864152/size=large/bgcol=333333/linkcol=00ffcc/tracklist=true/artwork=small/transparent=true/" seamless>
                <a href="https://bandcamp.com">Bandcamp Audio</a>
            </iframe>
        </div>
    </footer>

    <script>
        let projectDatabase = null;

        // 1. Launch Engine: Connects to JSON
        async function initDatabase() {
            try {
                const response = await fetch('./projects.json');
                projectDatabase = await response.json();
                
                // Load default software view on boot
                renderCategory('software');
            } catch (error) {
                console.error("Error connecting to project matrix database:", error);
                document.getElementById('project-list-container').innerHTML = 
                    '<p style="color: #ff3333;">Error compiling array data streams.</p>';
            }
        }

        // 2. Render logic for painting both header assets and card modules
        function renderCategory(categoryKey) {
            const container = document.getElementById('project-list-container');
            const subTitleElement = document.getElementById('category-title');
            
            // Get data block for chosen category
            const categoryData = projectDatabase[categoryKey];
            if (!categoryData) return;

            // --- A. UPGRADE TOP HERO DATA FROM JSON ---
            document.getElementById('hero-image').src = categoryData.header.image;
            document.getElementById('hero-title').textContent = categoryData.header.title;
            document.getElementById('hero-description').textContent = categoryData.header.text;

            // --- B. DRAW SUB-CONTENT STREAM ---
            subTitleElement.textContent = `${categoryKey} Content Logs`;
            container.innerHTML = ''; 

            const targetItems = categoryData.items;

            if (!targetItems || targetItems.length === 0) {
                container.innerHTML = '<p style="color: #666;">No modules logged in this category matrix.</p>';
                return;
            }

            // Loop and render matching item elements
            targetItems.forEach(project => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <img src="${project.image}" alt="${project.title}" class="project-image">
                    <div class="project-info">
                        <h2>${project.title}</h2>
                        <p>${project.description}</p>
                        <a href="${project.link}" target="_blank">Explore Module →</a>
                    </div>
                `;
                container.appendChild(card);
            });

            // Resets panel viewpoint seamlessly to absolute top
            document.getElementById('main-scroll-panel').scrollTop = 0;
        }

        // 3. User Trigger Navigation Handler
        function switchCategory(categoryKey, buttonElement) {
            if (!projectDatabase) return;

            const buttons = document.querySelectorAll('#nav-filters button');
            buttons.forEach(btn => btn.classList.remove('active'));

            buttonElement.classList.add('active');
            renderCategory(categoryKey);
        }

        initDatabase();

        // 4. Toggle Tracklist Up / Down state
        function toggleTracklist() {
            const wrapper = document.getElementById('player-wrapper');
            const button = document.getElementById('tracklist-toggle');
            wrapper.classList.toggle('expanded');
            
            if (wrapper.classList.contains('expanded')) {
                button.innerHTML = "▼ HIDE TRACKLIST";
            } else {
                button.innerHTML = "▲ SHOW TRACKLIST";
            }
        }

        // 5. Audio matrix switching links
        function changeTrack(embedId) {
            event.preventDefault(); 
            const player = document.getElementById('bandcamp-player');
            player.src = `https://bandcamp.com/EmbeddedPlayer/${embedId}/size=large/bgcol=333333/linkcol=00ffcc/tracklist=true/artwork=small/transparent=true/`;
        }
    </script>

</body>
</html>
