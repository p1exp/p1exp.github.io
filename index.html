<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P1EXP // Platform-1 Experimental</title>
    
    <script src="./database.js"></script>

    <style>
        /* --- CORE SYSTEM RESET --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0c0c0c;
            color: #e0e0e0;
            height: 100vh;
            display: grid;
            grid-template-rows: 60px 1fr auto; 
            overflow: hidden; 
        }

        /* --- HARDWARE CUSTOM SCROLLBARS --- */
        main::-webkit-scrollbar { width: 8px; }
        main::-webkit-scrollbar-track { background: #0c0c0c; }
        main::-webkit-scrollbar-thumb { background: #222; border: 1px solid #333; border-radius: 4px; }
        main::-webkit-scrollbar-thumb:hover { background: #00ffcc; }

        /* --- FRAME 1: NAV BAR --- */
        header {
            background-color: #121212;
            border-bottom: 2px solid #252525;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }

        header .logo { font-weight: bold; font-size: 1.1rem; color: #00ffcc; letter-spacing: 2px; }

        nav button {
            background: none; border: none; font-family: inherit; color: #888;
            margin-left: 20px; font-size: 0.85rem; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; transition: color 0.2s; padding: 5px 0;
        }
        nav button:hover, nav button.active { color: #00ffcc; border-bottom: 2px solid #00ffcc; }

        /* --- FRAME 2: SCROLLING CENTER PANELS --- */
        main {
            overflow-y: auto; padding-bottom: 40px; max-width: 850px;
            margin: 0 auto; width: 100%; border-left: 1px solid #1a1a1a; border-right: 1px solid #1a1a1a;
        }

        .workspace-hero { width: 100%; background-color: #111; border-bottom: 2px solid #222; margin-bottom: 30px; }
        .hero-banner-img { width: 100%; height: 260px; object-fit: cover; border-bottom: 1px solid #222; filter: grayscale(40%) contrast(110%); }
        .hero-text-container { padding: 25px 20px; }
        .hero-text-container h1 { color: #fff; font-size: 1.5rem; letter-spacing: 2px; margin-bottom: 10px; }
        .hero-text-container p { line-height: 1.6; color: #999; font-size: 0.9rem; }

        .content-inner-wrap { padding: 0 20px; }
        .section-label { color: #00ffcc; font-size: 0.9rem; margin: 35px 0 15px 0; letter-spacing: 2px; border-bottom: 1px dashed #222; padding-bottom: 6px; }

        /* --- FEATURED SINGLE CARD --- */
        .featured-project-card { background-color: #141414; border: 2px solid #222; border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
        .media-container { width: 100%; height: 340px; background-color: #000; border-bottom: 1px solid #222; position: relative; }
        .media-container img { width: 100%; height: 100%; object-fit: cover; }
        .media-container iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:0; }
        .featured-info { padding: 20px; }
        .featured-info h2 { color: #fff; font-size: 1.3rem; margin-bottom: 10px; }
        .meta-tag { font-size: 0.75rem; color: #00ffcc; background: #1a2925; padding: 2px 8px; display: inline-block; margin-bottom: 10px; border-radius: 3px; }

        /* --- COLLECTION GRID --- */
        .collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }
        .collection-item-card { background-color: #121212; border: 1px solid #222; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; }
        .collection-media { width: 100%; height: 220px; background: #000; position: relative; border-bottom: 1px solid #222; }
        .collection-media img { width:100%; height:100%; object-fit: cover; }
        .collection-media iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:0; }
        .collection-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .collection-info h3 { color: #fff; font-size: 1.1rem; margin-bottom: 8px; }
        .collection-info p { font-size: 0.85rem; color: #aaa; line-height: 1.5; flex-grow: 1; }
        .card-footer { font-size: 0.75rem; color: #666; margin-top: 10px; padding-top: 8px; border-top: 1px solid #222; font-style: italic; }

        /* --- FRAME 3: FOOTER DECK --- */
        footer { background-color: #121212; border-top: 2px solid #222; z-index: 10; display: flex; flex-direction: column; align-items: center; position: relative; }
        .toggle-btn-container { width: 100%; display: flex; justify-content: center; margin-top: -14px; z-index: 20; }
        .toggle-btn { background-color: #121212; color: #00ffcc; border: 2px solid #222; border-radius: 20px; padding: 4px 15px; font-family: inherit; font-size: 0.7rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
        .toggle-btn:hover { background-color: #00ffcc; color: #121212; border-color: #00ffcc; }
        .player-wrapper { width: 100%; max-width: 700px; height: 120px; overflow: hidden; transition: height 0.3s ease-in-out; }
        .player-wrapper.expanded { height: 300px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">P1EXP // LAB</div>
        <nav id="nav-filters">
            <button class="active" onclick="switchCategory('projects', this)">Projects</button>
            <button onclick="switchCategory('sessions', this)">Sessions</button>
            <button onclick="switchCategory('legacy', this)">Legacy</button>
        </nav>
    </header>

    <main id="main-scroll-panel">
        <section class="workspace-hero">
            <img id="hero-image" src="" class="hero-banner-img">
            <div class="hero-text-container">
                <h1 id="hero-title">ENGINE STABILIZED</h1>
                <p id="hero-description"></p>
            </div>
        </section>

        <div class="content-inner-wrap">
            <div class="section-label">SPOTLIGHT TRACK // MODULE</div>
            <div id="featured-project-container"></div>

            <div class="section-label">ARCHIVE DISCOGRAPHY COMPILATION</div>
            <div id="collection-grid-container" class="collection-grid"></div>
        </div>
    </main>

    <footer>
        <div class="toggle-btn-container">
            <button class="toggle-btn" id="tracklist-toggle" onclick="toggleTracklist()">▲ SHOW TRACKLIST</button>
        </div>
        <div class="player-wrapper" id="player-wrapper">
            <iframe id="bandcamp-player" style="border:0; width:100%; height:280px;" src="https://bandcamp.com/EmbeddedPlayer/album=327864152/size=large/bgcol=333333/linkcol=00ffcc/tracklist=true/artwork=small/transparent=true/" seamless></iframe>
        </div>
    </footer>

    <script>
        function renderCategory(categoryKey) {
            // Read directly from global object loaded in database.js
            const dataBlock = projectDatabase[categoryKey];
            if (!dataBlock) return;

            // 1. Map Top Banner View
            document.getElementById('hero-image').src = dataBlock.titleBanner.image;
            document.getElementById('hero-title').textContent = dataBlock.titleBanner.title;
            document.getElementById('hero-description').textContent = dataBlock.titleBanner.text;

            // 2. Map Central Primary Spotlight
            const featuredContainer = document.getElementById('featured-project-container');
            const feat = dataBlock.featuredProject;
            
            let mediaContent = `<img src="${feat.image}">`;
            if (feat.iframe) { mediaContent = feat.iframe; }

            featuredContainer.innerHTML = `
                <div class="featured-project-card">
                    <div class="media-container">${mediaContent}</div>
                    <div class="featured-info">
                        <h2>${feat.title}</h2>
                        ${feat.location ? `<span class="meta-tag">${feat.location}</span>` : ''}
                        <p>${feat.description}</p>
                    </div>
                </div>
            `;

            // 3. Map Secondary Collection Grid Array
            const collectionContainer = document.getElementById('collection-grid-container');
            collectionContainer.innerHTML = '';

            dataBlock.collection.forEach(item => {
                const card = document.createElement('div');
                card.className = 'collection-item-card';
                
                let subMedia = `<img src="${item.image}">`;
                if (item.iframe) { subMedia = item.iframe; }

                card.innerHTML = `
                    <div class="collection-media">${subMedia}</div>
                    <div class="collection-info">
                        <h3>${item.title}</h3>
                        <p>${item.description}</p>
                        ${item.footer ? `<div class="card-footer">${item.footer}</div>` : ''}
                    </div>
                `;
                collectionContainer.appendChild(card);
            });

            document.getElementById('main-scroll-panel').scrollTop = 0;
        }

        function switchCategory(categoryKey, buttonElement) {
            if (typeof projectDatabase === 'undefined') return;
            document.querySelectorAll('#nav-filters button').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            renderCategory(categoryKey);
        }

        function toggleTracklist() {
            const wrapper = document.getElementById('player-wrapper');
            const button = document.getElementById('tracklist-toggle');
            wrapper.classList.toggle('expanded');
            button.innerHTML = wrapper.classList.contains('expanded') ? "▼ HIDE TRACKLIST" : "▲ SHOW TRACKLIST";
        }

        // Run instantly without wait states
        if (typeof projectDatabase !== 'undefined') {
            renderCategory('projects');
        } else {
            document.getElementById('hero-title').textContent = "DATABASE LINK MISSING";
        }
    </script>
</body>
</html>
