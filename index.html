<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio & Projects Hub</title>
    <style>
        /* --- CORE SYSTEM RESET --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #121212;
            color: #e0e0e0;
            height: 100vh;
            display: grid;
            /* 3-Frame Layout: Header (60px), Center (flexible), Footer (grows with content) */
            grid-template-rows: 60px 1fr auto; 
            overflow: hidden; 
        }

        /* --- MODERN CUSTOM SCROLLBARS --- */
        main::-webkit-scrollbar {
            width: 8px;
        }
        main::-webkit-scrollbar-track {
            background: #121212; 
        }
        main::-webkit-scrollbar-thumb {
            background: #252525; 
            border: 1px solid #333;
            border-radius: 4px;
        }
        main::-webkit-scrollbar-thumb:hover {
            background: #00ffcc; 
        }

        /* --- FRAME 1: TOP NAVIGATION BAR --- */
        header {
            background-color: #1a1a1a;
            border-bottom: 2px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }

        header .logo {
            font-weight: bold;
            font-size: 1.2rem;
            color: #00ffcc;
            letter-spacing: 1px;
        }

        nav button {
            background: none;
            border: none;
            font-family: inherit;
            color: #aaa;
            margin-left: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.2s;
            padding: 5px 0;
        }

        nav button:hover, nav button.active {
            color: #00ffcc;
            border-bottom: 2px solid #00ffcc;
        }

        /* --- FRAME 2: SCROLLING CENTER CONTENT --- */
        main {
            overflow-y: auto; 
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .intro-block {
            background-color: #1a1a1a;
            border-left: 3px solid #00ffcc;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 4px;
        }

        /* Category Header Title inside the scrolling panel */
        #category-title {
            color: #00ffcc;
            font-size: 1.5rem;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- AUTOMATIC PROJECT CARD STYLES --- */
        .project-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            margin-bottom: 30px;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .project-image {
            width: 100%;
            height: 250px;
            object-fit: cover; 
            border-bottom: 1px solid #333;
        }

        .project-info {
            padding: 20px;
        }

        .project-info h2 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .project-info p {
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 15px;
        }

        /* Text Links */
        main a {
            color: #00ffcc;
            text-decoration: underline;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        main a:hover {
            color: #121212;
            background-color: #00ffcc;
            text-decoration: none;
        }

        /* --- FRAME 3: BOTTOM DECK (BANDCAMP & TOGGLE) --- */
        footer {
            background-color: #1a1a1a;
            border-top: 2px solid #333;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .toggle-btn-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: -14px; 
            z-index: 20;
        }

        .toggle-btn {
            background-color: #1a1a1a;
            color: #00ffcc;
            border: 2px solid #333;
            border-radius: 20px;
            padding: 4px 15px;
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
        }

        .toggle-btn:hover {
            background-color: #00ffcc;
            color: #1a1a1a;
            border-color: #00ffcc;
        }

        .player-wrapper {
            width: 100%;
            max-width: 700px;
            height: 120px;
            overflow: hidden;
            transition: height 0.3s ease-in-out;
            padding: 0px 0;
        }

        .player-wrapper.expanded {
            height: 300px; 
        }

        iframe {
            border: 0;
            width: 100%;
            height: 280px; 
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">DESKTOP // LAB</div>
        <nav id="nav-filters">
            <button class="active" onclick="switchCategory('software', this)">Software</button>
            <button onclick="switchCategory('hardware', this)">Hardware</button>
            <button onclick="switchCategory('audio', this)">Audio</button>
        </nav>
    </header>

    <main id="main-scroll-panel">
        <div class="intro-block">
            <p>Welcome to the multi-lane environment. Adjust the top menu indices or change background decks dynamically.</p>
            <p>
              Audio Matrix: 
              <a href="#" onclick="changeTrack('album=327864152')">Album 1</a> | 
              <a href="#" onclick="changeTrack('album=1568662603')">Album 2</a>.
            </p>
        </div>

        <h1 id="category-title">Software Array</h1>

        <div id="project-list-container">
            <p style="color: #666;">Initializing multi-stream index arrays...</p>
        </div>
    </main>

    <footer>
        <div class="toggle-btn-container">
            <button class="toggle-btn" id="tracklist-toggle" onclick="toggleTracklist()">▲ SHOW TRACKLIST</button>
        </div>
        
        <div class="player-wrapper" id="player-wrapper">
            <iframe id="bandcamp-player" src="https://bandcamp.com/EmbeddedPlayer/album=327864152/size=large/bgcol=333333/linkcol=00ffcc/tracklist=true/artwork=small/transparent=true/" seamless>
                <a href="https://bandcamp.com">Bandcamp Audio</a>
            </iframe>
        </div>
    </footer>

    <script>
        // Global data cache variable
        let projectDatabase = null;

        // 1. Initial Launch Engine: Fetches the entire dataset once
        async function initDatabase() {
            try {
                const response = await fetch('./projects.json');
                projectDatabase = await response.json();
                
                // Render the default view on launch (software section)
                renderCategory('software');
            } catch (error) {
                console.error("Error connecting to project matrix database:", error);
                document.getElementById('project-list-container').innerHTML = 
                    '<p style="color: #ff3333;">Error compiling array data streams.</p>';
            }
        }

        // 2. Render logic for painting cards into the scrolling view frame
        function renderCategory(categoryKey) {
            const container = document.getElementById('project-list-container');
            const titleElement = document.getElementById('category-title');
            
            // Set Section Title Text
            titleElement.textContent = `${categoryKey} Archive`;
            container.innerHTML = ''; // Wipe old elements

            const targetArray = projectDatabase[categoryKey];

            if (!targetArray || targetArray.length === 0) {
                container.innerHTML = '<p style="color: #666;">No modules logged in this category matrix.</p>';
                return;
            }

            // Loop and compile matching elements
            targetArray.forEach(project => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <img src="${project.image}" alt="${project.title}" class="project-image">
                    <div class="project-info">
                        <h2>${project.title}</h2>
                        <p>${project.description}</p>
                        <a href="${project.link}" target="_blank">Explore Module →</a>
                    </div>
                `;
                container.appendChild(card);
            });

            // Snap the center scrolling column layout back to top when tabs are switched
            document.getElementById('main-scroll-panel').scrollTop = 0;
        }

        // 3. User Trigger Handler for Button Interactivity states
        function switchCategory(categoryKey, buttonElement) {
            if (!projectDatabase) return;

            // Remove visual highlight from old active button links
            const buttons = document.querySelectorAll('#nav-filters button');
            buttons.forEach(btn => btn.classList.remove('active'));

            // Apply style line status highlight to clicked button
            buttonElement.classList.add('active');

            // Swap out the data items visible
            renderCategory(categoryKey);
        }

        // Boot everything up on system execution entry
        initDatabase();

        // 4. Toggle Tracklist Up / Down state
        function toggleTracklist() {
            const wrapper = document.getElementById('player-wrapper');
            const button = document.getElementById('tracklist-toggle');
            wrapper.classList.toggle('expanded');
            
            if (wrapper.classList.contains('expanded')) {
                button.innerHTML = "▼ HIDE TRACKLIST";
            } else {
                button.innerHTML = "▲ SHOW TRACKLIST";
            }
        }

        // 5. Audio matrix switching links
        function changeTrack(embedId) {
            event.preventDefault(); 
            const player = document.getElementById('bandcamp-player');
            player.src = `https://bandcamp.com/EmbeddedPlayer/${embedId}/size=large/bgcol=333333/linkcol=00ffcc/tracklist=true/artwork=small/transparent=true/`;
        }
    </script>

</body>
</html>
