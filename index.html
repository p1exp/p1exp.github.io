<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P1EXP // Platform-1 Experimental</title>
    
    <script src="./database.js"></script>

    <style>
        /* --- CORE SYSTEM RESET --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0c0c0c;
            color: #e0e0e0;
            height: 100vh;
            display: grid;
            grid-template-rows: 60px 1fr auto; 
            overflow: hidden; 
        }

        /* --- STYLED HARDWARE SCROLLBARS --- */
        main::-webkit-scrollbar { width: 8px; }
        main::-webkit-scrollbar-track { background: #0c0c0c; }
        main::-webkit-scrollbar-thumb { background: #222; border: 1px solid #333; border-radius: 4px; }
        main::-webkit-scrollbar-thumb:hover { background: #00ffcc; }

        /* --- FRAME 1: TOP NAVIGATION MENU (Locked 100vw Width) --- */
        header {
            background-color: #121212; border-bottom: 2px solid #252525;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; z-index: 10; width: 100vw;
        }
        header .logo { font-weight: bold; font-size: 1.1rem; color: #00ffcc; letter-spacing: 2px; }
        nav button {
            background: none; border: none; font-family: inherit; color: #888;
            margin-left: 20px; font-size: 0.85rem; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; transition: color 0.2s; padding: 5px 0;
        }
        nav button:hover, nav button.active { color: #00ffcc; border-bottom: 2px solid #00ffcc; }

        /* --- FRAME 2: SCROLLING CENTER RECONSTRUCTION PANEL --- */
        main {
            overflow-y: auto; padding-bottom: 40px; width: 100vw;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 850px) minmax(0, 1fr);
        }

        /* --- TITLE & PROJECT BREAKOUT HERO STRIPS (100vw Full width) --- */
        .workspace-hero, .modular-breakout-banner { 
            grid-column: 1 / -1; 
            width: 100vw; 
            background-color: #111; 
            position: relative; 
            overflow: hidden;
        }
        .workspace-hero { height: 50vh; border-bottom: 2px solid #222; }
        .modular-breakout-banner { height: 40vh; margin-top: 40px; border-top: 2px solid #222; border-bottom: 2px solid #222; }

        .banner-bg-img { 
            width: 100%; height: 100%; object-fit: cover; 
            filter: grayscale(40%) contrast(110%) brightness(35%); 
        }

        /* Clean full-bleed overlay centering title headings cleanly */
        .banner-text-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            text-align: center; padding: 0 20px;
            background: linear-gradient(to bottom, rgba(12,12,12,0.2) 0%, rgba(12,12,12,0.5) 100%);
            z-index: 2;
        }
        .banner-text-overlay h1, .banner-text-overlay h2 { 
            color: #fff; font-size: 2rem; letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 4px 12px rgba(0,0,0,0.9); 
        }

        /* --- NEW: DETACHED STANDALONE DESCRIPTION BLOCKS (850px Content Columns) --- */
        .banner-description-block {
            grid-column: 2;
            padding: 30px 20px 20px 20px;
            width: 100%;
        }
        .banner-description-block p {
            line-height: 1.7;
            color: #b0b0b0;
            font-size: 0.95rem;
            border-left: 2px solid #252525;
            padding-left: 20px;
        }

        /* --- COMPACT ARCHIVE CARD CONTAINER (850px Locked) --- */
        .card-inner-alignment-track {
            grid-column: 2;
            padding: 15px 20px;
            width: 100%;
        }

        .project-layout-card { 
            background-color: #121212; border: 1px solid #222; border-radius: 4px; 
            overflow: hidden; margin-bottom: 25px; display: flex; flex-direction: row; width: 100%;
        }
        
        .card-thumbnail { 
            width: 160px; height: 160px; aspect-ratio: 1 / 1; 
            object-fit: cover; border-right: 1px solid #222; flex-shrink: 0; 
        }

        .card-details { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-details h3 { color: #fff; font-size: 1.15rem; margin-bottom: 8px; }
        .card-details p { font-size: 0.85rem; color: #aaa; line-height: 1.5; margin-bottom: 15px; }

        .route-link {
            align-self: flex-start; background: #1a1a1a; color: #00ffcc; 
            border: 1px solid #00ffcc; padding: 6px 14px; font-size: 0.75rem; 
            font-family: inherit; font-weight: bold; cursor: pointer; text-decoration: none; 
            border-radius: 3px; transition: all 0.2s; margin-top: auto; letter-spacing: 1px;
        }
        .route-link:hover { background: #00ffcc; color: #121212; box-shadow: 0 0 10px rgba(0,255,204,0.3); }

        /* --- FRAME 3: THE BOTTOM RUNTIME MEDIA DECK PANEL --- */
        footer { background-color: #121212; border-top: 2px solid #222; z-index: 10; display: flex; flex-direction: column; align-items: center; position: relative; width: 100vw; }
        .toggle-btn-container { width: 100%; display: flex; justify-content: center; margin-top: -14px; z-index: 20; }
        .toggle-btn { background-color: #121212; color: #00ffcc; border: 2px solid #222; border-radius: 20px; padding: 4px 15px; font-family: inherit; font-size: 0.7rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
        .toggle-btn:hover { background-color: #00ffcc; color: #121212; border-color: #00ffcc; }
        .player-wrapper { width: 100%; max-width: 700px; height: 140px; overflow: hidden; transition: height 0.3s ease-in-out; padding: 10px 0; }
        .player-wrapper.expanded { height: 360px; }
        iframe#master-deck-frame { width: 100%; height: 100%; border: 0; background: #000; }

        /* --- RESPONSIVE PHONE BREAKER TRANSITIONS --- */
        @media (max-width: 768px) {
            .workspace-hero, .modular-breakout-banner { height: 40vh; }
            .banner-text-overlay h1, .banner-text-overlay h2 { font-size: 1.4rem; }
            
            .banner-description-block { padding: 20px 15px 10px 15px; }
            .banner-description-block p { font-size: 0.85rem; padding-left: 15px; }

            .card-inner-alignment-track { padding: 0 15px; }
            .project-layout-card { flex-direction: column; }
            .card-thumbnail { width: 100%; height: auto; aspect-ratio: 1 / 1; border-right: none; border-bottom: 1px solid #222; }
            .card-details { padding: 15px; }
            .route-link { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="site-logo">LOADING TITLE...</div>
        <nav id="nav-filters"></nav>
    </header>

    <main id="main-scroll-panel">
        
        <section class="workspace-hero">
            <img id="hero-image" src="" class="banner-bg-img">
            <div class="banner-text-overlay">
                <h1 id="hero-title"></h1>
            </div>
        </section>

        <div class="banner-description-block">
            <p id="hero-description"></p>
        </div>

        <div id="dynamic-stream-canvas" style="display: contents;"></div>
        
    </main>

    <footer>
        <div class="toggle-btn-container">
            <button class="toggle-btn" id="tracklist-toggle" onclick="toggleTracklist()">▲ DECK MATRIX</button>
        </div>
        <div class="player-wrapper" id="player-wrapper">
            <iframe id="master-deck-frame" src="https://bandcamp.com/EmbeddedPlayer/album=327864152/size=large/bgcol=333333/linkcol=00ffcc/tracklist=true/artwork=small/transparent=true/" allow="autoplay; encrypted-media; fullscreen"></iframe>
        </div>
    </footer>

    <script>
        let menuShowLabel = "▲ SHOW DECK MATRIX";
        let menuHideLabel = "▼ HIDE DECK MATRIX";

        function bootstrapApplication() {
            if (typeof projectDatabase === 'undefined') {
                document.getElementById('hero-title').textContent = "DATABASE FILE ERROR";
                return;
            }

            const config = projectDatabase.siteConfiguration;
            menuShowLabel = config.sectionLabels.deckMatrixShow;
            menuHideLabel = config.sectionLabels.deckMatrixHide;

            document.getElementById('site-logo').textContent = config.logoTitle;
            document.getElementById('tracklist-toggle').textContent = menuShowLabel;

            const navContainer = document.getElementById('nav-filters');
            navContainer.innerHTML = '';

            config.navigationMenu.forEach((menuItem, idx) => {
                const btn = document.createElement('button');
                btn.textContent = menuItem.label;
                if (idx === 0) btn.className = 'active'; 
                btn.addEventListener('click', function() {
                    switchCategory(menuItem.id, this);
                });
                navContainer.appendChild(btn);
            });

            if (config.navigationMenu.length > 0) {
                renderCategory(config.navigationMenu[0].id);
            }
        }

        function renderCategory(categoryKey) {
            const dataBlock = projectDatabase[categoryKey];
            if (!dataBlock) return;

            // 1. Process Master Site Header Elements
            if (dataBlock.titleBanner) {
                document.getElementById('hero-image').src = dataBlock.titleBanner.image || '';
                document.getElementById('hero-title').textContent = dataBlock.titleBanner.title || '';
                document.getElementById('hero-description').textContent = dataBlock.titleBanner.text || '';
            }

            // 2. Wipe active canvas elements clean
            const streamCanvas = document.getElementById('dynamic-stream-canvas');
            streamCanvas.innerHTML = '';

            let currentCardWrapper = null;

            // 3. Loop through canvas stream items
            if (dataBlock.layoutCanvas && Array.isArray(dataBlock.layoutCanvas)) {
                dataBlock.layoutCanvas.forEach(node => {
                    
                    if (node.type === 'breakoutBanner') {
                        currentCardWrapper = null; // Reset width alignment tracker

                        // Banner full width section
                        const bannerSection = document.createElement('section');
                        bannerSection.className = 'modular-breakout-banner';
                        bannerSection.innerHTML = `
                            <img src="${node.image}" class="banner-bg-img">
                            <div class="banner-text-overlay">
                                <h2>${node.title || ''}</h2>
                            </div>
                        `;
                        streamCanvas.appendChild(bannerSection);

                        // --- NEW ENGINE FEATURE: INJECT DETACHED 850px DESCRIPTION TEXT AREA ---
                        if (node.longDescription) {
                            const descBlock = document.createElement('div');
                            descBlock.className = 'banner-description-block';
                            descBlock.innerHTML = `<p>${node.longDescription}</p>`;
                            streamCanvas.appendChild(descBlock);
                        }

                    } else if (node.type === 'archiveCard') {
                        if (!currentCardWrapper) {
                            currentCardWrapper = document.createElement('div');
                            currentCardWrapper.className = 'card-inner-alignment-track';
                            streamCanvas.appendChild(currentCardWrapper);
                        }

                        const card = document.createElement('div');
                        card.className = 'project-layout-card';
                        card.innerHTML = `
                            <img src="${node.image}" class="card-thumbnail">
                            <div class="card-details">
                                <h3>${node.title || ''}</h3>
                                <p>${node.description || ''}</p>
                                ${node.mediaUrl ? `<button class="route-link" onclick="routeToDeck('${node.mediaUrl}')">${node.buttonLabel || 'PLAY'}</button>` : ''}
                            </div>
                        `;
                        currentCardWrapper.appendChild(card);
                    }
                });
            }

            document.getElementById('main-scroll-panel').scrollTop = 0;
        }

        function routeToDeck(targetUrl) {
            const deckFrame = document.getElementById('master-deck-frame');
            const wrapper = document.getElementById('player-wrapper');
            deckFrame.src = targetUrl;
            wrapper.classList.add('expanded');
            document.getElementById('tracklist-toggle').innerHTML = menuHideLabel;
        }

        function switchCategory(categoryKey, buttonElement) {
            document.querySelectorAll('#nav-filters button').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            renderCategory(categoryKey);
        }

        function toggleTracklist() {
            const wrapper = document.getElementById('player-wrapper');
            const button = document.getElementById('tracklist-toggle');
            wrapper.classList.toggle('expanded');
            button.innerHTML = wrapper.classList.contains('expanded') ? menuHideLabel : menuShowLabel;
        }

        window.addEventListener('DOMContentLoaded', bootstrapApplication);
    </script>
</body>
</html>
