<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P1EXP // Platform-1 Experimental</title>
    
    <!-- CENTRAL CORE DATA REGISTRY LINK -->
    <script src="./database.js"></script>

    <style>
        /* --- CORE SYSTEM RESET --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0c0c0c;
            color: #e0e0e0;
            height: 100vh;
            display: grid;
            grid-template-rows: 60px 1fr auto; 
            overflow: hidden; 
        }

        /* --- HARDWARE CUSTOM SCROLLBARS --- */
        main::-webkit-scrollbar { width: 8px; }
        main::-webkit-scrollbar-track { background: #0c0c0c; }
        main::-webkit-scrollbar-thumb { background: #222; border: 1px solid #333; border-radius: 4px; }
        main::-webkit-scrollbar-thumb:hover { background: #00ffcc; }

        /* --- FRAME 1: TOP NAV BAR ($100vw Edge-to-Edge) --- */
        header {
            background-color: #121212;
            border-bottom: 2px solid #252525;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
            width: 100vw;
        }

        header .logo { font-weight: bold; font-size: 1.1rem; color: #00ffcc; letter-spacing: 2px; }

        nav button {
            background: none; border: none; font-family: inherit; color: #888;
            margin-left: 20px; font-size: 0.85rem; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; transition: color 0.2s; padding: 5px 0;
        }
        nav button:hover, nav button.active { color: #00ffcc; border-bottom: 2px solid #00ffcc; }

        /* --- FRAME 2: SCROLLING CENTER ENGINE (Sub-Grid Tracking) --- */
        main {
            overflow-y: auto;
            padding-bottom: 40px;
            width: 100vw;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 850px) minmax(0, 1fr);
        }

        /* --- FEATURE A: 100vw TITLE BANNER HERO --- */
        .workspace-hero { 
            grid-column: 1 / -1; 
            width: 100vw; 
            background-color: #111; 
            border-bottom: 2px solid #222; 
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: inherit; 
        }

        .hero-banner-img { 
            grid-column: 1 / -1;
            width: 100vw; 
            height: 260px; 
            object-fit: cover; 
            border-bottom: 1px solid #222; 
            filter: grayscale(40%) contrast(110%); 
        }

        .hero-text-container { 
            grid-column: 2; 
            padding: 25px 20px; 
        }
        .hero-text-container h1 { color: #fff; font-size: 1.5rem; letter-spacing: 2px; margin-bottom: 10px; }
        .hero-text-container p { line-height: 1.6; color: #999; font-size: 0.9rem; }

        /* --- FEATURE B: 100vw FEATURED PROJECT SPOTLIGHT --- */
        #featured-project-container {
            grid-column: 1 / -1; 
            width: 100vw;
            background-color: #141414;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
            margin-bottom: 35px;
            display: grid;
            grid-template-columns: inherit; 
        }

        .featured-wrapper-card {
            grid-column: 2; 
            display: flex;
            flex-direction: row;
            width: 100%;
        }

        /* --- FEATURE C: 850px FIXED WIDTH ARCHIVE WRAPPER --- */
        .content-inner-wrap { 
            grid-column: 2; 
            padding: 0 20px; 
        }
        
        .section-label { color: #00ffcc; font-size: 0.9rem; margin: 15px 0 20px 0; letter-spacing: 2px; border-bottom: 1px dashed #222; padding-bottom: 6px; }
        
        .wide-label {
            grid-column: 2;
            padding: 0 20px;
        }

        /* --- DISCOGRAPHY INTERFACE LAYOUT CARDS --- */
        .project-layout-card { 
            background-color: #121212; border: 1px solid #222; border-radius: 4px; 
            overflow: hidden; margin-bottom: 25px; display: flex; flex-direction: row;
            width: 100%;
        }

        .featured-wrapper-card .project-layout-card {
            border: none; background: transparent; border-radius: 0; margin-bottom: 0;
        }
        
        .card-thumbnail { width: 220px; height: 160px; object-fit: cover; border-right: 1px solid #222; flex-shrink: 0; }
        .featured-wrapper-card .card-thumbnail { width: 300px; height: 200px; }

        .card-details { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-details h2, .card-details h3 { color: #fff; font-size: 1.15rem; margin-bottom: 8px; }
        .card-details p { font-size: 0.85rem; color: #aaa; line-height: 1.5; margin-bottom: 15px; }
        
        .meta-tag { font-size: 0.75rem; color: #00ffcc; background: #1a2925; padding: 2px 8px; align-self: flex-start; margin-bottom: 10px; border-radius: 3px; }
        .card-footer-text { font-size: 0.75rem; color: #555; margin-top: auto; font-style: italic; }

        /* ACTION ROUTING INTERFACE BUTTONS */
        .route-link {
            align-self: flex-start; background: #1a1a1a; color: #00ffcc; 
            border: 1px solid #00ffcc; padding: 6px 14px; font-size: 0.75rem; 
            font-family: inherit; font-weight: bold; cursor: pointer; text-decoration: none; 
            border-radius: 3px; transition: all 0.2s; margin-top: auto;
            letter-spacing: 1px;
        }
        .route-link:hover { background: #00ffcc; color: #121212; box-shadow: 0 0 10px rgba(0,255,204,0.3); }

        /* --- FRAME 3: FOOTER RUNTIME MEDIA DECK --- */
        footer { background-color: #121212; border-top: 2px solid #222; z-index: 10; display: flex; flex-direction: column; align-items: center; position: relative; width: 100vw; }
        .toggle-btn-container { width: 100%; display: flex; justify-content: center; margin-top: -14px; z-index: 20; }
        .toggle-btn { background-color: #121212; color: #00ffcc; border: 2px solid #222; border-radius: 20px; padding: 4px 15px; font-family: inherit; font-size: 0.7rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
        .toggle-btn:hover { background-color: #00ffcc; color: #121212; border-color: #00ffcc; }
        
        .player-wrapper { width: 100%; max-width: 700px; height: 140px; overflow: hidden; transition: height 0.3s ease-in-out; padding: 10px 0; }
        .player-wrapper.expanded { height: 360px; }
        iframe#master-deck-frame { width: 100%; height: 100%; border: 0; background: #000; }

        /* --- RESPONSIVE MOBILE WIREFRAME OVERRIDES --- */
        @media (max-width: 768px) {
            .project-layout-card, .featured-wrapper-card { flex-direction: column; }
            .card-thumbnail, .featured-wrapper-card .card-thumbnail {
                width: 100%; height: 220px; border-right: none; border-bottom: 1px solid #222;
            }
            .hero-text-container { padding: 20px 15px; }
            .content-inner-wrap, .wide-label { padding: 0 15px; }
            .route-link { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- FRAME 1: TOP NAVIGATION NODE -->
    <header>
        <div class="logo" id="site-logo"></div>
        <nav id="nav-filters"></nav>
    </header>

    <!-- FRAME 2: MAIN ENGINE CORE LAYER -->
    <main id="main-scroll-panel">
        
        <!-- ELEMENT A: TOP BANNER SPLIT CHASSIS -->
        <section class="workspace-hero">
            <img id="hero-image" src="" class="hero-banner-img">
            <div class="hero-text-container">
                <h1 id="hero-title"></h1>
                <p id="hero-description"></p>
            </div>
        </section>

        <div class="section-label wide-label" id="spotlight-label"></div>

        <!-- ELEMENT B: EDGE TO EDGE DYNAMIC SPOTLIGHT LAYER -->
        <div id="featured-project-container"></div>

        <!-- ELEMENT C: LOCKED 850px CATALOG WRAPPER ARCHIVE -->
        <div class="content-inner-wrap">
            <div class="section-label" id="archive-label"></div>
            <div id="collection-grid-container"></div>
        </div>
        
    </main>

    <!-- FRAME 3: ANCHORED STREAM INTERFACE DECK -->
    <footer>
        <div class="toggle-btn-container">
            <button class="toggle-btn" id="tracklist-toggle" onclick="toggleTracklist()"></button>
        </div>
        <div class="player-wrapper" id="player-wrapper">
            <iframe id="master-deck-frame" src="https://bandcamp.com/EmbeddedPlayer/album=327864152/size=large/bgcol=333333/linkcol=00ffcc/tracklist=true/artwork=small/transparent=true/" allow="autoplay; encrypted-media; fullscreen"></iframe>
        </div>
    </footer>

    <!-- SYSTEM RUNTIME CONTEXT ENGINE -->
    <script>
        function bootstrapApplication() {
            if (typeof masterCollectionRegistry === 'undefined') return;
            const config = siteConfiguration;

            // Map standard static config items
            document.getElementById('site-logo').textContent = config.logoTitle || '';
            document.getElementById('spotlight-label').textContent = config.sectionLabels.spotlight || '';
            document.getElementById('archive-label').textContent = config.sectionLabels.archive || '';
            document.getElementById('tracklist-toggle').textContent = config.sectionLabels.deckMatrixShow || '';

            // Generate category filter selectors dynamically
            const navContainer = document.getElementById('nav-filters');
            navContainer.innerHTML = '';

            config.navigationMenu.forEach((menuItem, idx) => {
                const btn = document.createElement('button');
                btn.textContent = menuItem.label;
                if (idx === 0) btn.className = 'active'; 
                btn.onclick = function() { switchCategory(menuItem.id, this); };
                navContainer.appendChild(btn);
            });

            // Initial view injection loop
            loadPageView(config.navigationMenu[0].id);
        }

        function loadPageView(pageKey) {
            const pageMap = pageLayoutEngine[pageKey];
            if (!pageMap) return;

            // 1. Process 100vw Header Hero Block Text fields using innerHTML
            document.getElementById('hero-image').src = pageMap.titleBanner.image || '';
            document.getElementById('hero-title').innerHTML = pageMap.titleBanner.title || '';
            document.getElementById('hero-description').innerHTML = pageMap.titleBanner.text || '';

            // 2. Query data for the 60vh Spotlight Module from Cat No references
            const featuredContainer = document.getElementById('featured-project-container');
            const fKey = pageMap.featuredKey;
            const feat = masterCollectionRegistry[fKey];
            
            if (feat) {
                featuredContainer.innerHTML = `
                    <div class="featured-wrapper-card">
                        <div class="project-layout-card">
                            <img src="${feat.image || ''}" class="card-thumbnail">
                            <div class="card-details">
                                <h2>${feat.title || ''}</h2>
                                <span class="meta-tag">P1-${fKey} // ${feat.date || ''}</span>
                                <p>${feat.description || ''}</p>
                                ${feat.mediaUrl ? `<button class="route-link" onclick="routeToDeck('${feat.mediaUrl}')">▶ PLAY ARCHIVE DECK</button>` : ''}
                            </div>
                        </div>
                    </div>
                `;
                featuredContainer.style.display = "grid";
            } else {
                featuredContainer.style.display = "none";
            }

            // 3. Process ordered catalog list grids down below cleanly inside the 850px constraint
            const collectionContainer = document.getElementById('collection-grid-container');
            collectionContainer.innerHTML = '';

            if (pageMap.archiveKeys && pageMap.archiveKeys.length > 0) {
                pageMap.archiveKeys.forEach(key => {
                    const item = masterCollectionRegistry[key];
                    if (!item) return; 

                    const card = document.createElement('div');
                    card.className = 'project-layout-card';
                    card.innerHTML = `
                        <img src="${item.image || ''}" class="card-thumbnail">
                        <div class="card-details">
                            <h3>${item.title || ''}</h3>
                            <span class="meta-tag">P1-${key} // ${item.date || ''}</span>
                            <p>${item.description || ''}</p>
                            ${item.mediaUrl ? `<button class="route-link" onclick="routeToDeck('${item.mediaUrl}')">▶ PLAY ARCHIVE DECK</button>` : ''}
                            ${item.footer ? `<div class="card-footer-text">${item.footer}</div>` : ''}
                        </div>
                    `;
                    collectionContainer.appendChild(card);
                });
            }

            document.getElementById('main-scroll-panel').scrollTop = 0;
        }

        // Send embedded links down cleanly into the locked master player footer deck
        function routeToDeck(targetUrl) {
            const deckFrame = document.getElementById('master-deck-frame');
            const wrapper = document.getElementById('player-wrapper');
            deckFrame.src = targetUrl;
            wrapper.classList.add('expanded');
            document.getElementById('tracklist-toggle').innerHTML = siteConfiguration.sectionLabels.deckMatrixHide;
        }

        function switchCategory(categoryKey, buttonElement) {
            document.querySelectorAll('#nav-filters button').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            loadPageView(categoryKey);
        }

        function toggleTracklist() {
            const wrapper = document.getElementById('player-wrapper');
            const button = document.getElementById('tracklist-toggle');
            const labels = siteConfiguration.sectionLabels;

            wrapper.classList.toggle('expanded');
            button.innerHTML = wrapper.classList.contains('expanded') ? labels.deckMatrixHide : labels.deckMatrixShow;
        }

        // Initialize execution stack pipelines
        bootstrapApplication();
    </script>
</body>
</html>
