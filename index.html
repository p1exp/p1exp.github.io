<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P1EXP // Platform-1 Experimental</title>
    
    <link rel="icon" type="image/png" href="./p1logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;700&display=swap" rel="stylesheet">

    <script src="./database.js"></script>

    <style>
        /* --- CORE SYSTEM RESET --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Jura', sans-serif;
            background-color: #0c0c0c;
            color: #e0e0e0;
            height: 100vh;
            display: grid;
            grid-template-rows: 60px 1fr auto; 
            overflow: hidden; 
        }

        /* --- HARDWARE CUSTOM SCROLLBARS --- */
        main::-webkit-scrollbar { width: 8px; }
        main::-webkit-scrollbar-track { background: #0c0c0c; }
        main::-webkit-scrollbar-thumb { background: #222; border: 1px solid #333; border-radius: 4px; }
        main::-webkit-scrollbar-thumb:hover { background: #00ffcc; }

        /* --- FRAME 1: TOP NAV BAR --- */
        header {
            background-color: #121212; border-bottom: 2px solid #252525;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; z-index: 10; width: 100%;
        }

        header .logo { 
            font-weight: 700; 
            font-size: 1.2rem; 
            color: #00ffcc; 
            letter-spacing: 2px; 
            text-decoration: none; 
        }

        /* --- Align Nav Links to the Right --- */
        nav {
            text-align: right;
        }

        nav button {
            background: none; border: none; font-family: inherit; color: #888;
            margin-left: 25px; font-size: 0.9rem; text-transform: uppercase;
            font-weight: 500; letter-spacing: 1.5px; cursor: pointer; transition: color 0.2s; padding: 5px 0;
        }
        nav button:hover, nav button.active { color: #00ffcc; border-bottom: 2px solid #00ffcc; }

        /* --- FRAME 2: SCROLLING CENTER ENGINE --- */
        main {
            overflow-y: auto; padding-bottom: 40px; width: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 950px) minmax(0, 1fr);
            opacity: 1;
            transition: opacity 0.3s ease-in-out;
        }
        main.fade-out {
            opacity: 0;
        }

        /* --- FULL BLEED BANNERS --- */
        .full-banner { 
            grid-column: 1 / -1; 
            width: 100%; 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            background-color: #111; 
        }
        .banner-70 { height: 70vh; border-bottom: 2px solid #222; }
        .banner-60 { height: 60vh; border-top: 1px solid #222; border-bottom: 2px solid #222; margin-top: 40px; }

        .banner-img { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; filter: grayscale(40%) contrast(110%) brightness(65%); z-index: 1; 
        }

        .banner-heading { 
            position: relative; z-index: 2; color: #fff; text-align: center; 
            text-shadow: 0 4px 12px rgba(0,0,0,0.9); padding: 0 20px; 
        }
        .banner-heading h1 { font-size: 2.5rem; letter-spacing: 5px; font-weight: 700; }
        .banner-heading h2 { font-size: 2rem; letter-spacing: 4px; font-weight: 700; }

        /* --- 950px NARROW TEXT BLOCKS BELOW BANNERS --- */
        .narrow-text-block { 
            grid-column: 2; 
            padding: 40px 20px; 
            text-align: center; 
        }
        .narrow-text-block p { color: #ccc; line-height: 1.7; font-size: 1rem; letter-spacing: 0.5px; }

        /* --- 950px COLLECTION LIST WRAPPER --- */
        .collection-grid { 
            grid-column: 2; 
            padding: 0 20px; 
            display: flex;
            flex-direction: column;
            gap: 25px; 
        }

        /* --- HORIZONTAL ROW CARDS WITH SQUARE IMAGES --- */
        .project-layout-card { 
            background-color: #121212; border: 1px solid #222; border-radius: 4px; 
            overflow: hidden; display: flex; flex-direction: row; width: 100%;
        }
        
        .card-thumbnail { 
            width: 200px; 
            height: 200px; 
            object-fit: cover; 
            border-right: 1px solid #222; 
            flex-shrink: 0; 
        }

        .card-details { padding: 22px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-details h3 { color: #fff; font-size: 1.3rem; margin-bottom: 8px; font-weight: 700; letter-spacing: 1px; }
        .card-details p { font-size: 0.95rem; color: #aaa; line-height: 1.6; margin-bottom: 15px; }
        
        .meta-tag { font-size: 0.8rem; color: #00ffcc; background: #1a2925; padding: 3px 10px; align-self: flex-start; margin-bottom: 12px; border-radius: 3px; font-weight: 500; letter-spacing: 0.5px; }
        .card-footer-text { font-size: 0.8rem; color: #555; margin-top: auto; font-style: italic; font-weight: 400; }

        /* --- ACTION ROUTING BUTTONS --- */
        .route-link {
            align-self: flex-start; background: #1a1a1a; color: #00ffcc; 
            border: 1px solid #00ffcc; padding: 7px 16px; font-size: 0.8rem; 
            font-family: inherit; font-weight: 700; cursor: pointer; border-radius: 3px; 
            transition: all 0.2s; margin-top: auto; letter-spacing: 1.5px; text-transform: uppercase;
        }
        .route-link:hover { background: #00ffcc; color: #121212; box-shadow: 0 0 10px rgba(0,255,204,0.3); }

        /* --- NEXT PAGE ROUTING BUTTON --- */
        .next-page-wrapper {
            grid-column: 2;
            display: flex;
            justify-content: flex-end;
            padding: 40px 20px;
            margin-top: 20px;
            border-top: 1px solid #222;
        }
        
        .next-page-btn {
            background: #111;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 12px 24px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border-radius: 3px;
        }
        
        .next-page-btn:hover {
            background: #00ffcc;
            color: #121212;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        /* --- FRAME 3: FOOTER RUNTIME MEDIA DECK --- */
        footer { background-color: #121212; border-top: 2px solid #222; z-index: 10; display: flex; flex-direction: column; align-items: center; position: relative; width: 100%; }
